# CI (1.6.0): all the plugin suites on Linux, macOS and Windows, split in jobs that run at the same time, one per group
# of a groups file: tools/suite-gruppi.list for Linux and macOS (the same three groups), tools/suite-gruppi-windows.list
# for Windows. Job k of n runs `tools/suite.sh --gruppi <file> --gruppo k/n`, with n = strategy.job-total (the number of
# jobs of the matrix, never written by hand) and k = matrix.gruppo, which the step requires equal to
# strategy.job-index + 1 (the matrix is exactly 1..n, in order). suite.sh refuses a groups file that does not cover
# tools/suite.list exactly (every entry in a group, or left out with «- <entry> <reason>») or whose groups are not
# exactly 1..n: so a matrix with fewer jobs than the file has groups (or more) is red, it cannot be green without a
# group (tools/suite.test.sh checks this file: each matrix 1..n with n = the groups of its file, the --gruppi and
# --gruppo arguments built as above). The final jobs «linux», «windows» and «macos» succeed only if all the groups of
# their platform succeed, and «ci» only if all three do: «ci» is the check to require on main.
# MAAT_ATTESE_RICHIESTE=1 in every job, at EVERY push and pull request (stricter than MAAT_CERT_RICHIESTO of 1.5.x,
# which was on only for main, tags and pull requests to main): tools/esempi-equiv.test.sh (the expected outputs of the
# public corpus, tools/esempi-equiv/attese/, with the two validators: the system Python, minimal validator, and a venv
# with jsonschema at a fixed version, MAAT_PY_JSONSCHEMA; the same version that `attese.sh --scrivi` requires) is red
# with a validator SALTATO, and with a file of attese/ changed since the merge-base with origin/main (fetch-depth: 0)
# without a new line in attese/STORIA. It is in group 3 of tools/suite-gruppi.list, group 2 of the Windows file.
# Windows (D6 of the 1.6.0 plan): Git Bash of the runner, FIC_PYTHON = the Python 3.10 of setup-python (otherwise
# `py -3` would choose the newest Python of the runner and the minimum would not be proven), FIC_WT_WSL=0 (suite.sh),
# core.autocrlf false (as the local Windows proofs), TEMP in its long form. Complete at EVERY push: the rule of D6
# (complete at every push if it fits in at most 8 jobs of at most 45 minutes, otherwise only on pull requests to main)
# measured on the first CI of 1.6.0: 5 jobs of about 20 minutes. Left out on Windows (lines «-» of its file): the four
# suites that want WSL (run locally at release) and the oracle.
# macOS (D7): bash and the GNU tools from Homebrew (cache of its downloads), their gnubin folders first in the PATH, awk
# = gawk, TMPDIR=$RUNNER_TEMP (on macOS /var is a link to /private/var).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}
env:
  MAAT_ATTESE_RICHIESTE: "1"
  JSONSCHEMA_VERSIONE: "jsonschema==4.23.0"
jobs:
  linux-gruppo:
    name: linux (group ${{ matrix.gruppo }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Measure: in 1.5.1 the groups took 816, 818 and 804 s on the Linux clone in WSL and the CI up to 1.1 times that;
    # 1.6.0 (block C: no bash engine, driver.test.sh ~65 s) estimates them at ~600, ~625 and ~700 s. Longest group
    # ~12 min, plus ~2 min of setup = 14; limit = first multiple of 5 min above 1.5 × 14 = 21 → 25 (revised on the
    # times of the CI, docs of block D).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gruppo: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test identity for the temporary git repositories
        run: |
          git config --global user.name "Maat CI"
          git config --global user.email "ci@example.invalid"
      - name: jsonschema in a venv of its own (the second validator)
        run: |
          python -m venv "$RUNNER_TEMP/maat-venv"
          "$RUNNER_TEMP/maat-venv/bin/python" -m pip install --disable-pip-version-check --quiet "$JSONSCHEMA_VERSIONE"
          echo "MAAT_PY_JSONSCHEMA=$RUNNER_TEMP/maat-venv/bin/python" >> "$GITHUB_ENV"
      - name: Suites of group ${{ matrix.gruppo }}
        run: |
          test "${{ matrix.gruppo }}" = "$(( ${{ strategy.job-index }} + 1 ))" ||
            { echo "matrix.gruppo ${{ matrix.gruppo }} is not job ${{ strategy.job-index }} + 1: the matrix must be 1..n in order" >&2; exit 2; }
          bash tools/suite.sh --gruppi tools/suite-gruppi.list --gruppo ${{ matrix.gruppo }}/${{ strategy.job-total }} esiti
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esiti-linux-${{ matrix.gruppo }}
          path: esiti/

  macos-gruppo:
    name: macos (group ${{ matrix.gruppo }}/${{ strategy.job-total }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gruppo: [1, 2, 3]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      MAAT_BREW: "bash coreutils gnu-sed findutils grep gawk diffutils flock rsync"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache of the Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ env.MAAT_BREW }}-1
      # setup-python and setup-node before the GNU tools in the PATH: the install script of setup-python fails with
      # the GNU chmod (first CI of 1.6.0); the folders added after it hold no python, so 3.10 stays the python3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: bash and the GNU tools from Homebrew, first in the PATH; awk = gawk; TMPDIR
        run: |
          t0=$(date +%s)
          brew install $MAAT_BREW
          P=$(brew --prefix)
          G=$RUNNER_TEMP/maat-gnu
          mkdir -p "$G"
          ln -sf "$P/bin/bash" "$G/bash"
          ln -sf "$P/bin/gawk" "$G/awk"
          for f in coreutils gnu-sed findutils grep diffutils; do
            d=$P/opt/$f/libexec/gnubin
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          echo "$G" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "brew: $(( $(date +%s) - t0 )) s"
      - name: The tools the suites will use
        run: |
          for c in bash sed awk grep find xargs stat date sha256sum timeout flock rsync diff python3 git; do
            printf '%-10s %s · %s\n' "$c" "$(command -v "$c")" "$("$c" --version 2>&1 | head -1)"
          done
          echo "TMPDIR=$TMPDIR · nproc $(nproc) · $(sysctl -n hw.memsize) bytes"; vm_stat | head -6
      - name: Test identity for the temporary git repositories
        run: |
          git config --global user.name "Maat CI"
          git config --global user.email "ci@example.invalid"
      - name: jsonschema in a venv of its own (the second validator)
        run: |
          python -m venv "$RUNNER_TEMP/maat-venv"
          "$RUNNER_TEMP/maat-venv/bin/python" -m pip install --disable-pip-version-check --quiet "$JSONSCHEMA_VERSIONE"
          echo "MAAT_PY_JSONSCHEMA=$RUNNER_TEMP/maat-venv/bin/python" >> "$GITHUB_ENV"
      - name: Suites of group ${{ matrix.gruppo }}
        run: |
          test "${{ matrix.gruppo }}" = "$(( ${{ strategy.job-index }} + 1 ))" ||
            { echo "matrix.gruppo ${{ matrix.gruppo }} is not job ${{ strategy.job-index }} + 1: the matrix must be 1..n in order" >&2; exit 2; }
          bash tools/suite.sh --gruppi tools/suite-gruppi.list --gruppo ${{ matrix.gruppo }}/${{ strategy.job-total }} esiti
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esiti-macos-${{ matrix.gruppo }}
          path: esiti/

  windows-gruppo:
    name: windows (group ${{ matrix.gruppo }}/${{ strategy.job-total }})
    runs-on: windows-latest
    # Measure (first CI of 1.6.0, before block C): the longest group ~1170 s of suites plus ~90 s of setup = 21 min;
    # limit = first multiple of 5 min above 1.5 × 21 = 31.5 → 35.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gruppo: [1, 2, 3, 4, 5]
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as in the repository
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test identity, FIC_PYTHON, long TEMP, jsonschema in a venv of its own
        run: |
          git config --global user.name "Maat CI"
          git config --global user.email "ci@example.invalid"
          echo "FIC_PYTHON=$(cygpath -m '${{ steps.py.outputs.python-path }}')" >> "$GITHUB_ENV"
          # TEMP of the runner in the long form: runneradmin has more than 8 letters, so the runner gives
          # C:\Users\RUNNER~1\…, which Python expands and bash does not (first CI of 1.6.0: reds in maat-paths,
          # gates, harness-merge, plan-check from the two spellings of one folder). Locally TEMP is long.
          L=$(cygpath -w -l "$TEMP")
          echo "TEMP=$L" >> "$GITHUB_ENV"; echo "TMP=$L" >> "$GITHUB_ENV"; echo "TEMP: $TEMP → $L"
          V=$(cygpath -u "$RUNNER_TEMP")/maat-venv
          "${{ steps.py.outputs.python-path }}" -m venv "$(cygpath -w "$V")"
          "$V/Scripts/python.exe" -m pip install --disable-pip-version-check --quiet "$JSONSCHEMA_VERSIONE"
          echo "MAAT_PY_JSONSCHEMA=$(cygpath -m "$V/Scripts/python.exe")" >> "$GITHUB_ENV"
          bash --version | head -1; git --version; command -v timeout
      - name: Suites of group ${{ matrix.gruppo }}
        run: |
          echo "TEMP=$TEMP · /tmp = $(cygpath -w /tmp)"
          test "${{ matrix.gruppo }}" = "$(( ${{ strategy.job-index }} + 1 ))" ||
            { echo "matrix.gruppo ${{ matrix.gruppo }} is not job ${{ strategy.job-index }} + 1: the matrix must be 1..n in order" >&2; exit 2; }
          bash tools/suite.sh --gruppi tools/suite-gruppi-windows.list --gruppo ${{ matrix.gruppo }}/${{ strategy.job-total }} esiti
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esiti-windows-${{ matrix.gruppo }}
          path: esiti/

  linux:
    name: linux
    needs: linux-gruppo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All the groups green
        run: |
          echo "groups: ${{ needs.linux-gruppo.result }}"
          test "${{ needs.linux-gruppo.result }}" = success
  macos:
    name: macos
    needs: macos-gruppo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All the groups green
        run: |
          echo "groups: ${{ needs.macos-gruppo.result }}"
          test "${{ needs.macos-gruppo.result }}" = success
  windows:
    name: windows
    needs: windows-gruppo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All the groups green
        run: |
          echo "groups: ${{ needs.windows-gruppo.result }}"
          test "${{ needs.windows-gruppo.result }}" = success
  ci:
    name: ci
    needs: [linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The blocking platforms green
        run: |
          echo "linux: ${{ needs.linux.result }} · macos: ${{ needs.macos.result }} · windows: ${{ needs.windows.result }}"
          test "${{ needs.linux.result }}" = success && test "${{ needs.macos.result }}" = success && test "${{ needs.windows.result }}" = success
